# MangoMail Configuration
# This file defines all environment variables used by the MangoMail service

# Service Configuration

[service.MANGOMAIL_LOG_LEVEL]
go-type = "LogLevel"
default = "info"
description = """Log level for the service (debug, info, warn, error)"""
used-by = ["mangomail"]

[service.MANGOMAIL_LOG_COLOR]
go-type = "bool"
default = "true"
description = """Log color for the service"""
used-by = ["mangomail"]

# Resend Configuration

[resend.MANGOMAIL_RESEND_API_KEY]
go-type = "RedactedString"
file = true
description = """Resend API key for sending emails. Can be loaded from file using MANGOMAIL_RESEND_API_KEY_FILE"""
used-by = ["mangomail"]

[resend.MANGOMAIL_RESEND_RATE_LIMIT]
go-type = "int"
default = "2"
description = """Maximum number of email requests per second (rate limit)"""
used-by = ["mangomail"]

# HTTP API Configuration

[http.MANGOMAIL_MAX_STARTUP_TIME]
go-type = "Duration"
default = "10"
description = """Maximum startup time for the service"""
used-by = ["mangomail"]

[http.MANGOMAIL_HTTP_MAX_RETRIES]
default = "3"
go-type = "int"
description = """Maximum number of retry attempts for HTTP server startup after encountering an error."""
used-by = ["mangomail"]

[http.MANGOMAIL_HTTP_RETRY_INTERVAL]
default = "5"
go-type = "Duration"
description = """Wait time between HTTP server startup retry attempts."""
used-by = ["mangomail"]

[http.MANGOMAIL_API_KEY]
go-type = "RedactedString"
file = true
description = """API key for authenticating HTTP API requests. Can be loaded from file using MANGOMAIL_API_KEY_FILE"""
used-by = ["mangomail"]

[http.MANGOMAIL_HTTP_ADDRESS]
go-type = "string"
default = ":8081"
description = """HTTP server address and port for the API server"""
used-by = ["mangomail"]

[http.MANGOMAIL_TELEMETRY_ADDRESS]
go-type = "string"
default = ":8080"
description = """Telemetry server address and port for health checks and metrics"""
used-by = ["mangomail"]