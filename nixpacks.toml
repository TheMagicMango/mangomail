# Disable auto-detection, just download the pre-built binary
providers = []

[phases.setup]
nixPkgs = ["curl", "gnutar", "gzip"]

[phases.install]
cmds = ["curl -sL https://github.com/TheMagicMango/mangomail/releases/download/v0.1.2/mangomail_0.1.2_linux_amd64.tar.gz | tar xz"]

[start]
cmd = "./mangomail serve"