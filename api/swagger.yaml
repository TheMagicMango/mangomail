basePath: /
definitions:
  handler.BadRequestError:
    properties:
      message:
        type: string
    type: object
  handler.InternalServerError:
    properties:
      message:
        type: string
    type: object
  middleware.UnauthorizedError:
    properties:
      message:
        type: string
    type: object
  usecase.SendEmailInputDTO:
    properties:
      attachments:
        items:
          type: string
        type: array
      from:
        type: string
      html:
        type: string
      reply_to:
        type: string
      subject:
        type: string
      to:
        type: string
    required:
    - from
    - html
    - subject
    - to
    type: object
host: mangomail.up.railway.app
info:
  contact:
    name: Magic Mango
    url: https://github.com/TheMagicMango/mangomail
  description: HTTP API for sending emails programmatically via Resend
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: MangoMail API
  version: "1.0"
paths:
  /api/v1/send:
    post:
      consumes:
      - application/json
      description: Send a single email using the Resend API
      parameters:
      - description: API Key for authentication
        in: header
        name: x-api-key
        required: true
        type: string
      - description: Email request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/usecase.SendEmailInputDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Email sent successfully
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.BadRequestError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.UnauthorizedError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.InternalServerError'
      security:
      - ApiKeyAuth: []
      summary: Send an email
      tags:
      - email
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
